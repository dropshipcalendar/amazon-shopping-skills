<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dropship Calendar — API credentials</title>
  <link rel="stylesheet" href="/setup.css">
  <script src="/setup.js" defer></script>
</head>
<body>
  <main>
    <div class="shape blue" aria-hidden="true"></div><div class="shape mint" aria-hidden="true"></div>
    <header><img src="/logo.png" alt="" width="32" height="32"><span>Dropship <strong>Calendar</strong></span></header>
    <h1>API credentials</h1>
    <form autocomplete="off">
      <label for="agentmail">AgentMail API key</label>
      <input id="agentmail" type="password" name="AGENTMAIL_API_KEY" maxlength="4096" autocomplete="off" spellcheck="false" autocapitalize="none">
      <label for="textverified">TextVerified API key</label>
      <input id="textverified" type="password" name="TEXTVERIFIED_API_KEY" maxlength="4096" autocomplete="off" spellcheck="false" autocapitalize="none">
      <label for="username">TextVerified username</label>
      <input id="username" type="text" name="TEXTVERIFIED_API_USERNAME" maxlength="4096" autocomplete="off" spellcheck="false" autocapitalize="none">
      <div class="actions"><button type="submit">Save</button><button type="button" id="later">Configure later</button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
